<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <!-- Mantenha o Head e CSS igual ao anterior, apenas adicionei um ajuste no botão de áudio -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sestini The Game - Relax Edition</title>
    <style>
        /* ... (Mantenha todo o CSS anterior) ... */
        :root {
            --primary: #c41230; 
            --bg-color: #f4f4f9;
            --tube-color: rgba(255, 255, 255, 0.6);
            --tube-border: rgba(255, 255, 255, 0.8);
            --text-color: #333;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; font-family: var(--font-main);
            background-color: var(--bg-color); background-size: cover;
            background-position: center; transition: background-image 1.2s ease-in-out;
            color: var(--text-color); overflow: hidden; display: flex;
            flex-direction: column; height: 100vh;
        }

        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.4); z-index: 0; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
        .screen.active { display: flex; }
        #menu-screen { background: linear-gradient(135deg, rgba(196, 18, 48, 0.9) 0%, rgba(139, 13, 34, 0.9) 100%); color: white; z-index: 20; }
        .logo { font-size: 3.5rem; font-weight: 900; margin-bottom: 0.5rem; text-shadow: 2px 4px 10px rgba(0,0,0,0.3); letter-spacing: 2px; }
        .nickname-container { margin-bottom: 20px; background: rgba(255,255,255,0.2); padding: 12px 25px; border-radius: 20px; cursor: pointer; border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; gap: 12px; }
        .btn { background: white; color: var(--primary); border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; margin: 8px; width: 260px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        #game-header { width: 100%; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(5px); position: relative; z-index: 15; }
        #game-area { flex-grow: 1; width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; padding: 20px; gap: 15px; position: relative; z-index: 10; }
        .tube { width: 65px; height: 210px; background: linear-gradient(to bottom, var(--tube-color), rgba(255,255,255,0.2)); border: 4px solid var(--tube-border); border-radius: 0 0 35px 35px; display: flex; flex-direction: column-reverse; align-items: center; padding-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .tube.selected { transform: translateY(-15px); border-color: var(--primary); }
        .item { width: 50px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .controls { padding: 20px; display: flex; gap: 15px; justify-content: center; z-index: 15; }
        .icon-btn { background: white; border: none; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; position: relative; }
        .btn-price-tag { position: absolute; bottom: -5px; background: #222; color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 10px; }
        #audio-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: rgba(0,0,0,0.5); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
        .modal { background: white; border-radius: 20px; padding: 20px; width: 90%; max-width: 400px; text-align: center; }
        .store-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .buy-btn { background: var(--primary); color: white; border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="audio-toggle" onclick="toggleAudio()">🔇</button>
    <div class="bg-overlay"></div>

    <!-- Menus (Simplificados para o exemplo funcional) -->
    <div id="menu-screen" class="screen active">
        <div class="logo">SESTINI</div>
        <div style="margin-bottom: 2rem;">THE GAME</div>
        <button class="btn" onclick="startGame()">JOGAR</button>
        <button class="btn" style="background:#222; color:white" onclick="showScreen('store-screen')">LOJA</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-header">
            <div>Fase: <span id="lvl-txt">1</span></div>
            <div style="color:var(--primary)">💰 <span id="coins-txt">0</span></div>
            <div onclick="showScreen('menu-screen')" style="cursor:pointer">🏠</div>
        </div>
        <div id="game-area"></div>
        <div class="controls">
            <button class="icon-btn" onclick="undoMove()">↩️</button>
            <button class="icon-btn" onclick="restartLevel()">🔄</button>
            <button class="icon-btn" onclick="useHint()">💡</button>
        </div>
    </div>

    <div id="store-screen" class="screen">
        <div class="modal">
            <h3>Loja Sestini</h3>
            <div class="store-item">
                <span>+500 Moedas</span>
                <button class="buy-btn" onclick="addCoins(500)">PEGAR</button>
            </div>
            <button class="btn" onclick="showScreen('menu-screen')">VOLTAR</button>
        </div>
    </div>

    <script>
        // --- MOTOR DE ÁUDIO (RELAXING SYNTH) ---
        let audioCtx = null;
        let isMuted = true;
        let musicInterval = null;
        let currentStep = 0;

        // Escalas musicais relaxantes por estágio (Frequências em Hz)
        const SCALES = [
            [261.63, 293.66, 329.63, 392.00, 440.00], // Estágio 1: Zen (C Pentatônico)
            [311.13, 349.23, 392.00, 466.16, 523.25], // Estágio 2: Oceano (Eb Major)
            [196.00, 220.00, 246.94, 293.66, 329.63], // Estágio 3: Floresta (G Major)
            [277.18, 311.13, 369.99, 415.30, 466.16], // Estágio 4: Sonho (Db Major)
            [220.00, 261.63, 293.66, 329.63, 392.00]  // Estágio 5: Noite (A Minor)
        ];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration, vol) {
            if (isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startRelaxingMusic() {
            if (musicInterval) clearInterval(musicInterval);
            
            musicInterval = setInterval(() => {
                if (isMuted || !audioCtx) return;

                // Seleciona a escala baseada no nível atual (1 a 5)
                const scaleIndex = (gameState.level - 1) % 5;
                const currentScale = SCALES[scaleIndex];
                
                // Melodia principal (Ondas Senoidais - Suaves)
                if (currentStep % 2 === 0) {
                    const note = currentScale[Math.floor(Math.random() * currentScale.length)];
                    playTone(note, 'sine', 1.5, 0.05);
                }

                // Baixo suave a cada 4 tempos
                if (currentStep % 4 === 0) {
                    const bassNote = currentScale[0] / 2;
                    playTone(bassNote, 'triangle', 2.0, 0.03);
                }

                currentStep++;
            }, 800); // Ritmo lento e relaxante
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            document.getElementById('audio-toggle').innerText = isMuted ? '🔇' : '🔊';
            if (!isMuted) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startRelaxingMusic();
            }
        }

        // --- LÓGICA DO JOGO ---
        let gameState = {
            level: 1,
            coins: 100,
            tubes: [],
            selected: null,
            history: []
        };

        const ITEMS = ['🧳', '🎒', '👜', '💼', '👝', '🔒', '🕶️', '🎧'];

        function startGame() {
            showScreen('game-screen');
            initLevel();
            if (!isMuted) startRelaxingMusic();
        }

        function initLevel() {
            gameState.selected = null;
            gameState.history = [];
            const colors = Math.min(3 + Math.floor(gameState.level / 2), 8);
            let pool = [];
            for(let i=0; i<colors; i++) {
                for(let j=0; j<4; j++) pool.push(ITEMS[i]);
            }
            pool.sort(() => Math.random() - 0.5);

            gameState.tubes = [];
            for(let i=0; i<colors; i++) {
                gameState.tubes.push(pool.slice(i*4, i*4+4));
            }
            gameState.tubes.push([], []); // Tubos vazios
            
            render();
            updateUI();
        }

        function render() {
            const area = document.getElementById('game-area');
            area.innerHTML = '';
            gameState.tubes.forEach((content, idx) => {
                const tube = document.createElement('div');
                tube.className = `tube ${gameState.selected === idx ? 'selected' : ''}`;
                tube.onclick = () => tapTube(idx);
                content.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.innerText = item;
                    tube.appendChild(div);
                });
                area.appendChild(tube);
            });
        }

        function tapTube(idx) {
            const tubes = gameState.tubes;
            if (gameState.selected === null) {
                if (tubes[idx].length > 0) {
                    gameState.selected = idx;
                    playTone(440, 'sine', 0.1, 0.1); // Som de clique
                }
            } else {
                const from = gameState.selected;
                const to = idx;
                if (from !== to) {
                    const item = tubes[from][tubes[from].length-1];
                    if (tubes[to].length < 4 && (tubes[to].length === 0 || tubes[to][tubes[to].length-1] === item)) {
                        gameState.history.push(JSON.stringify(tubes));
                        tubes[to].push(tubes[from].pop());
                        playTone(523, 'sine', 0.1, 0.1); // Som de encaixe
                        checkWin();
                    }
                }
                gameState.selected = null;
            }
            render();
        }

        function checkWin() {
            const win = gameState.tubes.every(t => t.length === 0 || (t.length === 4 && t.every(v => v === t[0])));
            if (win) {
                playTone(523, 'triangle', 0.3, 0.2);
                setTimeout(() => playTone(659, 'triangle', 0.5, 0.2), 200);
                alert("Parabéns! Próximo destino...");
                gameState.level++;
                gameState.coins += 50;
                initLevel();
                // A música muda automaticamente no próximo intervalo pois depende do gameState.level
            }
        }

        // --- UTILITÁRIOS ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function updateUI() {
            document.getElementById('lvl-txt').innerText = gameState.level;
            document.getElementById('coins-txt').innerText = gameState.coins;
        }

        function undoMove() {
            if (gameState.history.length > 0) {
                gameState.tubes = JSON.parse(gameState.history.pop());
                render();
            }
        }

        function restartLevel() { initLevel(); }

        function addCoins(n) {
            gameState.coins += n;
            updateUI();
            alert("Moedas adicionadas para ajudar na sua viagem!");
        }

        function useHint() {
            alert("Dica: Tente liberar um tubo vazio primeiro!");
            gameState.coins -= 10;
            updateUI();
        }

    </script>
</body>
</html>
