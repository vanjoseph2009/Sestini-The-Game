<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sestini The Game</title>

    /* --- CÓDIGO DO GOOGLE ADSENSE AQUI --- */
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6917222908830790"
     crossorigin="anonymous"></script>
    
    <style>
        :root {
            --primary: #c41230; 
            --bg-color: #f4f4f9;
            --tube-bg: rgba(0, 0, 0, 0.25);
            --tube-border: #333;
            --text-color: #333;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0; font-family: var(--font-main);
            background-color: var(--bg-color); background-size: cover;
            background-position: center; transition: background-image 1.2s ease-in-out;
            color: var(--text-color); overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.3); z-index: 0; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; z-index: 10; }
        .screen.active { display: flex; }

        #menu-screen { justify-content: center; background: linear-gradient(135deg, rgba(196, 18, 48, 0.95) 0%, rgba(139, 13, 34, 0.95) 100%); color: white; z-index: 20; }

        /* --- ESTRUTURA DO CABEÇALHO (HOME ESQUERDA | SOM DIREITA) --- */
        #game-header { 
            height: 65px; width: 100%; padding: 0 15px; flex-shrink: 0;
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(255, 255, 255, 0.95); z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Estilo do botão de som dentro do header */
        #audio-toggle { 
            background: rgba(0,0,0,0.1); color: #333; border: none; 
            width: 42px; height: 42px; border-radius: 50%; 
            cursor: pointer; font-size: 1.2rem; display: flex; 
            align-items: center; justify-content: center;
        }

        /* --- ÁREA DE JOGO --- */
        #game-area { 
            flex: 1; width: 100%; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 10px; padding: 15px; align-content: center; justify-items: center;
            overflow: hidden; z-index: 10;
        }

        .tube { 
            width: 58px; height: 23vh; min-height: 140px; max-height: 200px;
            background: var(--tube-bg); border: 3px solid var(--tube-border);
            border-top: none; border-radius: 0 0 30px 30px;
            display: flex; flex-direction: column-reverse; align-items: center;
            padding-bottom: 8px; cursor: pointer; transition: transform 0.2s;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
        }

        .tube.selected { transform: translateY(-12px); border-color: var(--primary); background: rgba(196, 18, 48, 0.2); }

        .item { width: 100%; height: 22%; display: flex; align-items: center; justify-content: center; font-size: 26px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }

        /* --- CONTROLES INFERIORES --- */
        .controls { 
            height: 90px; width: 100%; flex-shrink: 0;
            display: flex; gap: 12px; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.95); border-top: 1px solid #ddd;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .icon-btn { 
            background: white; border: 1px solid #ccc; width: 52px; height: 52px; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center; 
            font-size: 1.4rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- LOJA --- */
        .modal { background: white; border-radius: 25px; width: 90%; max-width: 450px; padding: 20px; text-align: center; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .store-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; border-radius: 12px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        #store-list { overflow-y: auto; flex-grow: 1; text-align: left; }
        .store-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .buy-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 15px; font-weight: bold; }
        .buy-btn.owned { background: #2ecc71; }

        .btn { background: white; color: var(--primary); border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; margin: 8px; width: 260px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <!-- MENU -->
    <div id="menu-screen" class="screen active">
        <div style="font-size: 3.5rem; font-weight: 900; letter-spacing: 2px;">SESTINI</div>
        <div style="margin-bottom: 2rem; opacity: 0.9; letter-spacing: 4px;">THE GAME</div>
        <button class="btn" onclick="startGame()">JOGAR</button>
        <button class="btn" style="background:#222; color:white;" onclick="showScreen('store-screen')">LOJA</button>
    </div>

    <!-- JOGO -->
    <div id="game-screen" class="screen">
        <div id="game-header">
            <!-- Home na Esquerda -->
            <div onclick="showScreen('menu-screen')" style="font-size:1.8rem; cursor:pointer">🏠</div>
            
            <!-- Fase e Moedas no Meio -->
            <div style="display: flex; gap: 20px;">
                <div>Fase: <span id="lvl-txt" style="font-weight:bold">1</span></div>
                <div style="color:var(--primary); font-weight:bold">💰 <span class="coins-val">0</span></div>
            </div>

            <!-- Som na Direita -->
            <button id="audio-toggle" onclick="toggleAudio()">🔇</button>
        </div>

        <div id="game-area"></div>

        <div class="controls">
            <button class="icon-btn" onclick="undoMove()">↩️</button>
            <button class="icon-btn" onclick="restartLevel()">🔄</button>
            <button class="icon-btn" onclick="useHint()">💡</button>
            <button class="icon-btn" onclick="buyExtraTube()" style="color:var(--primary)">+🧪</button>
        </div>
    </div>

    <!-- LOJA -->
    <div id="store-screen" class="screen" style="justify-content:center; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);">
        <div class="modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin:0">Store</h2>
                <div style="font-weight: bold; color: var(--primary)">💰 <span class="coins-val">0</span></div>
            </div>
            <div class="store-tabs">
                <button class="tab-btn active" id="tab-power" onclick="renderStore('powerups')">ITENS</button>
                <button class="tab-btn" id="tab-skins" onclick="renderStore('skins')">SKINS</button>
            </div>
            <div id="store-list"></div>
            <button class="btn" style="width: 100%; background: #eee; color: #333; margin-top: 15px;" onclick="showScreen('menu-screen')">VOLTAR</button>
        </div>
    </div>

    <script>
        // --- MOTOR DE ÁUDIO RELAXANTE ---
        let audioCtx = null;
        let isMuted = true;
        let musicInterval = null;
        let currentStep = 0;

        const SCALES = [
            [261.63, 293.66, 329.63, 392.00, 440.00], // C Pentatonic
            [311.13, 349.23, 392.00, 466.16, 523.25], // Eb
            [196.00, 220.00, 246.94, 293.66, 329.63], // G
            [277.18, 311.13, 369.99, 415.30, 466.16], // Db
            [220.00, 261.63, 293.66, 329.63, 392.00]  // Am
        ];

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, vol) {
            if (isMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startRelaxingMusic() {
            if (musicInterval) clearInterval(musicInterval);
            musicInterval = setInterval(() => {
                if (isMuted || !audioCtx) return;
                const scaleIndex = (gameState.level - 1) % 5;
                const currentScale = SCALES[scaleIndex];
                if (currentStep % 2 === 0) {
                    const note = currentScale[Math.floor(Math.random() * currentScale.length)];
                    playTone(note, 'sine', 1.5, 0.04);
                }
                if (currentStep % 4 === 0) playTone(currentScale[0] / 2, 'triangle', 2.0, 0.02);
                currentStep++;
            }, 1000);
        }

        function toggleAudio() {
            initAudio();
            isMuted = !isMuted;
            document.getElementById('audio-toggle').innerText = isMuted ? '🔇' : '🔊';
            if (!isMuted) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                startRelaxingMusic();
            } else {
                if (musicInterval) clearInterval(musicInterval);
            }
        }

        // --- LÓGICA DO JOGO ---
        const SKIN_SETS = {
            classic: { name: 'Clássico', items: ['🧳', '🎒', '👜', '💼', '👝', '🔒', '🕶️', '🎧'], price: 0 },
            summer: { name: 'Verão', items: ['⛱️', '🍍', '🍦', '🏄', '👙', '🌴', '🍹', '📸'], price: 500 },
            winter: { name: 'Inverno', items: ['🧥', '🎿', '🏂', '🧤', '🏔️', '☕', '🧣', '⛸️'], price: 800 },
            business: { name: 'Executivo', items: ['👔', '⌚', '💻', '📱', '🖊️', '📄', '☕', '🏛️'], price: 1200 }
        };

        const BGS = [
            'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=60',
            'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=60',
            'https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?auto=format&fit=crop&w=800&q=60'
        ];

        let gameState = { 
            level: 1, 
            coins: 100, 
            ownedSkins: ['classic'], 
            activeSkin: 'classic',
            tubes: [], 
            selected: null, 
            history: [] 
        };

        function startGame() { showScreen('game-screen'); initLevel(); if(!isMuted) startRelaxingMusic(); }

        function initLevel() {
            gameState.selected = null; gameState.history = [];
            document.body.style.backgroundImage = `url('${BGS[gameState.level % BGS.length]}')`;
            const skin = SKIN_SETS[gameState.activeSkin].items;
            const numColors = Math.min(3 + Math.floor(gameState.level / 3), 8);
            let pool = [];
            for(let i=0; i<numColors; i++) { for(let j=0; j<4; j++) pool.push(skin[i]); }
            pool.sort(() => Math.random() - 0.5);
            gameState.tubes = [];
            for(let i=0; i<numColors; i++) gameState.tubes.push(pool.slice(i*4, i*4+4));
            gameState.tubes.push([], []);
            render(); updateUI();
        }

        function render() {
            const area = document.getElementById('game-area'); area.innerHTML = '';
            gameState.tubes.forEach((content, idx) => {
                const tube = document.createElement('div');
                tube.className = `tube ${gameState.selected === idx ? 'selected' : ''}`;
                tube.onclick = () => tapTube(idx);
                content.forEach(item => {
                    const div = document.createElement('div'); div.className = 'item'; div.innerText = item;
                    tube.appendChild(div);
                });
                area.appendChild(tube);
            });
        }

        function tapTube(idx) {
            const tubes = gameState.tubes;
            if (gameState.selected === null) {
                if (tubes[idx].length > 0) { gameState.selected = idx; playTone(400, 'sine', 0.1, 0.1); }
            } else {
                const from = gameState.selected;
                const to = idx;
                if (from !== to) {
                    const item = tubes[from][tubes[from].length-1];
                    if (tubes[to].length < 4 && (tubes[to].length === 0 || tubes[to][tubes[to].length-1] === item)) {
                        gameState.history.push(JSON.stringify(tubes));
                        tubes[to].push(tubes[from].pop());
                        playTone(600, 'sine', 0.1, 0.1);
                        checkWin();
                    }
                }
                gameState.selected = null;
            }
            render();
        }

        function checkWin() {
            const win = gameState.tubes.every(t => t.length === 0 || (t.length === 4 && t.every(v => v === t[0])));
            if (win) {
                setTimeout(() => {
                    alert("Viagem concluída! +50 moedas");
                    gameState.level++; gameState.coins += 50;
                    initLevel();
                }, 300);
            }
        }

        function updateUI() {
            document.getElementById('lvl-txt').innerText = gameState.level;
            document.querySelectorAll('.coins-val').forEach(el => el.innerText = gameState.coins);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'store-screen') renderStore('powerups');
        }

        // --- LOJA ---
        function renderStore(tab) {
            const list = document.getElementById('store-list');
            list.innerHTML = '';
            document.getElementById('tab-power').classList.toggle('active', tab === 'powerups');
            document.getElementById('tab-skins').classList.toggle('active', tab === 'skins');
            if (tab === 'powerups') {
                list.innerHTML = `<div class="store-item"><div><b>Bônus</b><br><small>+500 moedas</small></div><button class="buy-btn" onclick="addCoins(500)">PEGAR</button></div>`;
            } else {
                Object.keys(SKIN_SETS).forEach(id => {
                    const s = SKIN_SETS[id];
                    const isOwned = gameState.ownedSkins.includes(id);
                    const isActive = gameState.activeSkin === id;
                    list.innerHTML += `<div class="store-item"><div><b>${s.name}</b><br><small>${s.items.slice(0,4).join('')}</small></div><button class="buy-btn ${isOwned ? 'owned' : ''}" onclick="handleSkinClick('${id}')" ${isActive ? 'disabled' : ''}>${isActive ? 'ATIVO' : (isOwned ? 'USAR' : s.price + ' 💰')}</button></div>`;
                });
            }
        }

        function handleSkinClick(id) {
            if (gameState.ownedSkins.includes(id)) { gameState.activeSkin = id; }
            else {
                const price = SKIN_SETS[id].price;
                if (gameState.coins >= price) { gameState.coins -= price; gameState.ownedSkins.push(id); gameState.activeSkin = id; }
                else { alert("Moedas insuficientes!"); }
            }
            updateUI(); renderStore('skins');
        }

        function addCoins(n) { gameState.coins += n; updateUI(); renderStore('powerups'); }
        function undoMove() { if (gameState.history.length > 0) { gameState.tubes = JSON.parse(gameState.history.pop()); render(); } }
        function restartLevel() { if(confirm("Reiniciar fase?")) initLevel(); }
        function buyExtraTube() {
            if(gameState.coins >= 150) { gameState.coins -= 150; gameState.tubes.push([]); render(); updateUI(); }
            else { alert("Moedas insuficientes (150 necessário)"); }
        }
        function useHint() { alert("Dica: Foque em uma cor por vez!"); gameState.coins -= 20; updateUI(); }
    </script>
</body>
</html>
